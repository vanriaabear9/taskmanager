name: Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: GitHub release tag to create (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Android APK on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@24.12.1 build \
            --platform android \
            --profile production \
            --non-interactive \
            --wait \
            --json > eas-build.json

          build_id="$(jq -er '.[0].id' eas-build.json)"
          npx --yes eas-cli@24.12.1 build:view "$build_id" --json > eas-build-details.json
          apk_url="$(jq -er '.artifacts.applicationArchiveUrl' eas-build-details.json)"

          curl --fail --location --silent --show-error "$apk_url" --output todo-app.apk
          test -s todo-app.apk
          unzip -t todo-app.apk > /dev/null

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: gh release create "$TAG_NAME" todo-app.apk --title "$TAG_NAME" --generate-notes
